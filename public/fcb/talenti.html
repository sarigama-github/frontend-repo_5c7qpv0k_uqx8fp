<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FCB Sports Agency — Talenti</title>
  <meta name="description" content="Scopri i talenti rappresentati da FCB Sports Agency.">
  <link rel="icon" href="/favicon.svg">
</head>
<body data-page="talents">

  <header id="site-header"></header>

  <main class="pt-5">
    <section class="container py-5">
      <div class="text-center mb-4">
        <h1 class="section-title">I nostri talenti</h1>
        <p class="section-sub">Filtra per sport e ruolo per trovare il profilo ideale.</p>
      </div>

      <!-- Filter Bar -->
      <div class="d-flex flex-wrap gap-2 justify-content-center mb-3" id="filter-bar">
        <button class="btn btn-outline-gold active" data-filter="*">Tutti</button>
        <button class="btn btn-outline-gold" data-filter='[data-sport="Football"]'>Football</button>
        <button class="btn btn-outline-gold" data-filter='[data-sport="Basketball"]'>Basket</button>
      </div>

      <div class="d-flex flex-wrap gap-2 justify-content-center mb-4" id="role-bar">
        <button class="btn btn-outline-gold active" data-role="*">Tutti i Ruoli</button>
        <button class="btn btn-outline-gold" data-role="Forward">Forward</button>
        <button class="btn btn-outline-gold" data-role="Midfielder">Midfielder</button>
        <button class="btn btn-outline-gold" data-role="Defender">Defender</button>
        <button class="btn btn-outline-gold" data-role="Goalkeeper">Goalkeeper</button>
        <button class="btn btn-outline-gold" data-role="Guard">Guard</button>
        <button class="btn btn-outline-gold" data-role="Center">Center</button>
        <button class="btn btn-outline-gold" data-role="Playmaker">Playmaker</button>
      </div>

      <div class="grid d-flex flex-wrap justify-content-center"></div>
    </section>
  </main>

  <div id="site-footer"></div>
</body>
</html>
