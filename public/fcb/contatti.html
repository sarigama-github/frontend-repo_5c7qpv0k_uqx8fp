<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FCB Sports Agency — Contatti</title>
  <meta name="description" content="Contatta FCB Sports Agency per collaborazioni e rappresentanza.">
  <link rel="icon" href="/favicon.svg">
</head>
<body>
  <header id="site-header"></header>

  <main class="pt-5">
    <section class="container py-5">
      <div class="row g-4">
        <div class="col-lg-5">
          <h1 class="section-title mb-3">Contatti</h1>
          <p class="section-sub">Parliamo del tuo percorso. Siamo pronti ad ascoltare.</p>
          <div class="card-dark p-4 mb-3">
            <div class="d-flex align-items-center gap-2 mb-2"><i class="bi bi-geo-alt text-warning"></i><span>Milano, Italia</span></div>
            <div class="d-flex align-items-center gap-2 mb-2"><i class="bi bi-telephone text-warning"></i><a href="tel:+390212345678">+39 02 1234 5678</a></div>
            <div class="d-flex align-items-center gap-2"><i class="bi bi-envelope text-warning"></i><a href="mailto:info@fcbagency.com">info@fcbagency.com</a></div>
          </div>
        </div>
        <div class="col-lg-7">
          <div class="card-dark p-4">
            <form class="row g-3">
              <div class="col-md-6">
                <label class="form-label">Nome</label>
                <input type="text" class="form-control" placeholder="Il tuo nome">
              </div>
              <div class="col-md-6">
                <label class="form-label">Cognome</label>
                <input type="text" class="form-control" placeholder="Il tuo cognome">
              </div>
              <div class="col-12">
                <label class="form-label">Email</label>
                <input type="email" class="form-control" placeholder="name@example.com">
              </div>
              <div class="col-12">
                <label class="form-label">Messaggio</label>
                <textarea class="form-control" rows="5" placeholder="Raccontaci di te"></textarea>
              </div>
              <div class="col-12">
                <button type="submit" class="btn btn-gold">Invia</button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>
</body>
</html>
